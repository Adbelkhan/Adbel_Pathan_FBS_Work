<html>

<title>LoginPage</title>
</head>
<body>
<form action="Login" method="get">
        <label for="username">username:</label>
        <div>

            <input type="password" name="password"  id="password">
        </div>

        <div>
            <input type="submit" value="SignIn">
        </div>
    </form>

</body>
</html>
